# Provenance record for every source that entered either final corpus.
#
# Lecture 3 slide 25: "Record provenance — source, licence, date, filters
# applied. Take licenses associated with the text seriously. Crawled text is
# not necessarily redistributable."
#
# This file is a graded deliverable in disguise: spec §1.2 requires reporting
# "size, sources, cleaning steps, manual fraction".
#
# RULES
#   - collection_method is exactly "manual" or "downloaded".
#       manual     = we fetched from the primary source and did our own
#                    extraction/cleaning (own scrapers, Wikimedia XML dumps
#                    parsed with our extractor, PDFs/scans we OCR'd).
#       downloaded = someone else's pre-extracted, pre-cleaned corpus.
#   - docs_final / words_final are measured directly on the TRAIN split of
#     the final deduped corpus (data/<lang>/clean_deduped, filtered to
#     train.ids) -- post-cleaning, post-dedup, post-split, per source. Not
#     raw collection counts, and not a whole-corpus (train+val+test) figure.
#   - words_final is a word count, not a token estimate. An earlier version
#     of this project used a calibration fertility (1.463 Hindi, 1.688
#     Assamese, from an early throwaway tokenizer) to project token counts
#     per source -- that proxy was found to meaningfully overstate real
#     fertility once the actual selected tokenizers were trained and used to
#     count exactly (real fertility: 1.231 Hindi @32k, 1.472 Assamese @24k;
#     see PHASE1_PLAN.md §0.3 finding 21). The report's headline token totals
#     use the exact per-document tokenizer count, aggregated by source's
#     collection_method (manual vs downloaded), not a per-source proxy
#     multiplication -- do not multiply words_final by fertility to get a
#     per-source token count, it will reproduce the same error.
#   - retrieved dates are read back from the Doc.retrieved field actually
#     stamped at collection time, not reconstructed from memory.

